name: Remediate fast-uri security advisory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-fast-uri.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update vulnerable transitive dependency
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          cp package.json package.json.security-backup
          npm pkg set overrides.fast-uri=3.1.7
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          mv package.json.security-backup package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/fast-uri']?.version; if (v !== '3.1.7') { console.error('Expected fast-uri 3.1.7, got', v); process.exit(1); }"

      - name: Commit patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "S.Althaus"
          git config user.email "samuelalthaus@gmail.com"
          git add frontend/package-lock.json
          git diff --cached --check
          git commit -m "fix(security): update fast-uri to 3.1.7"
          git push
