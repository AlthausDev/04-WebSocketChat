name: Temporary Angular security lockfile regeneration
on:
  push:
    branches:
      - maintenance/angular-vite-security-20261030
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile using npm
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Apply compatible audit fixes
        run: |
          status=0
          npm audit fix --package-lock-only --ignore-scripts --no-fund || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Clean installation
        run: npm ci --no-fund
      - name: Build Angular
        run: npm run build
      - name: Run all six frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Reject high or critical advisories
        run: npm audit --audit-level=high
      - name: Commit npm-generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerar lockfile seguro con npm"
          git push origin HEAD:maintenance/angular-vite-security-20261030
