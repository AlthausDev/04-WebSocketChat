name: Temporary js-yaml security update

on:
  push:
    branches:
      - chore/js-yaml-4.3.2

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/js-yaml-4.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update js-yaml lockfile entry
        working-directory: frontend
        run: |
          npm update js-yaml --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json'); const v=l.packages?.['node_modules/js-yaml']?.version || l.dependencies?.['js-yaml']?.version; if(v!=='4.3.2') { console.error('Expected js-yaml 4.3.2, got '+v); process.exit(1) }"

      - name: Commit lockfile update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): bump js-yaml to 4.3.2'
            git push origin HEAD:chore/js-yaml-4.3.2
          fi
