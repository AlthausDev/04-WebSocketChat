version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - version-update:semver-major
